pipeline:
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitHub_Drone_Plugins_Org
        repoName: drone-buildx-acr
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Testing
        identifier: Testing
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Vet
                  identifier: Vet
                  spec:
                    connectorRef: HHI_Public_Images
                    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                    shell: Sh
                    command: go vet ./...
        variables:
          - name: DRONE_REPO_OWNER
            type: String
            description: ""
            required: false
            value: drone-plugins
    - parallel:
        - stage:
            name: windows-1809
            identifier: windows1809
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build binaries
                      identifier: Build
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.23.0
                        envVariables:
                          GOTOOLCHAIN: go1.26.10
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # windows
                          GOOS=windows

                          go build -o release/windows/amd64/buildx-acr.exe ./cmd/drone-buildx-acr
                  - step:
                      type: Plugin
                      name: BuildAndPushDockerPlugin
                      identifier: BuildAndPushDockerPlugin
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker:20.17.4-windows-1809-amd64
                        settings:
                          pull_image: true
                          no_cache: true
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/buildx-acr
                          dockerfile: docker/acr/Dockerfile.windows.amd64.1809
                          auto_tag: "true"
                          auto_tag_suffix: windows-1809-amd64
                          purge: "false"
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry
                      identifier: BuildAndPushDockerRegistry
                      spec:
                        envVariables:
                          PLUGIN_NO_CACHE: "true"
                          PLUGIN_PULL_IMAGE: "true"
                          PLUGIN_ENABLE_CACHE: "false"
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/buildx-acr
                        tags:
                          - windows-1809-amd64
                        caching: false
                        dockerfile: docker/acr/Dockerfile.windows.amd64.1809
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> == "branch"
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: windows-2019
                    os: Windows
            variables:
              - name: DRONE_REPO_OWNER
                type: String
                description: ""
                required: false
                value: drone-plugins
            delegateSelectors:
              - windows-vm
        - stage:
            name: windows-ltsc2022
            identifier: windowsltsc2022
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              platform:
                os: Windows
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build binaries
                      identifier: Build
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.23.0
                        envVariables:
                          GOTOOLCHAIN: go1.26.10
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # windows
                          GOOS=windows

                          go build -o release/windows/amd64/buildx-acr.exe ./cmd/drone-buildx-acr
                  - step:
                      type: Plugin
                      name: BuildAndPushDockerPlugin
                      identifier: BuildAndPushDockerPlugin
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker
                        settings:
                          pull_image: true
                          no_cache: true
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/buildx-acr
                          dockerfile: docker/acr/Dockerfile.windows.amd64.ltsc2022
                          auto_tag: "true"
                          auto_tag_suffix: windows-ltsc2022-amd64
                          purge: "false"
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry
                      identifier: BuildAndPushDockerRegistry
                      spec:
                        envVariables:
                          PLUGIN_NO_CACHE: "true"
                          PLUGIN_PULL_IMAGE: "true"
                          PLUGIN_ENABLE_CACHE: "false"
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/buildx-acr
                        tags:
                          - windows-ltsc2022-amd64
                        caching: false
                        dockerfile: docker/acr/Dockerfile.windows.amd64.ltsc2022
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> == "branch"
            variables:
              - name: DRONE_REPO_OWNER
                type: String
                description: ""
                required: false
                value: drone-plugins
        - stage:
            name: linux-amd64-acr
            identifier: linuxamd64acr
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build binaries
                      identifier: BuildPush
                      spec:
                        connectorRef: HHI_Public_Images
                        image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # linux
                          export GOOS=linux GOARCH=amd64

                          go build -v -ldflags "-X main.build=<+pipeline.sequenceId>" -a -tags netgo -o release/linux/amd64/buildx-acr ./cmd/drone-buildx-acr
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> != "tag"
                  - step:
                      type: Run
                      name: Build binaries - Tag
                      identifier: BuildTag
                      spec:
                        connectorRef: HHI_Public_Images
                        image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # linux
                          export GOOS=linux GOARCH=amd64

                          go build -v -ldflags "-X main.version=<+codebase.tag> -X main.build=<+pipeline.sequenceId>" -a -tags netgo -o release/linux/amd64/buildx-acr ./cmd/drone-buildx-acr
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: Plugin
                      name: BuildAndPushDockerPlugin
                      identifier: BuildAndPushDockerPlugin
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker:18
                        settings:
                          pull_image: true
                          no_cache: true
                          base_image_registry: harness0.harness.io
                          base_image_username: <+secrets.getValue("harness0HARUsername")>
                          base_image_password: <+secrets.getValue("harness0HARPAT")>
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/buildx-acr
                          dockerfile: docker/acr/Dockerfile.linux.amd64
                          auto_tag: "true"
                          auto_tag_suffix: linux-amd64
                          daemon_off: "false"
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry
                      identifier: BuildAndPushDockerRegistry
                      spec:
                        envVariables:
                          PLUGIN_NO_CACHE: "true"
                          PLUGIN_PULL_IMAGE: "true"
                          PLUGIN_ENABLE_CACHE: "false"
                        baseImageConnectorRefs:
                          - HHI_Public_Images
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/buildx-acr
                        tags:
                          - linux-amd64
                        caching: false
                        dockerfile: docker/acr/Dockerfile.linux.amd64
                      when:
                        stageStatus: Success
                        condition: "<+codebase.build.type> == \"branch\" \n"
            variables:
              - name: DRONE_REPO_OWNER
                type: String
                description: ""
                required: false
                value: drone-plugins
        - stage:
            name: linux-arm64-acr
            identifier: linuxarm64acr
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              platform:
                os: Linux
                arch: Arm64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build binaries - Push
                      identifier: Build_Push
                      spec:
                        connectorRef: HHI_Public_Images
                        image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # linux
                          export GOOS=linux GOARCH=arm64

                          go build -v -ldflags "-X main.build=<+pipeline.sequenceId>" -a -tags netgo -o release/linux/arm64/buildx-acr ./cmd/drone-buildx-acr
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> != "tag"
                  - step:
                      type: Run
                      name: Build binaries - Tag
                      identifier: Build_Tag
                      spec:
                        connectorRef: HHI_Public_Images
                        image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                        shell: Sh
                        command: |-
                          # force go modules
                          export GOPATH=""

                          # disable cgo
                          export CGO_ENABLED=0

                          set -e
                          set -x

                          # linux
                          export GOOS=linux GOARCH=arm64

                          go build -v -ldflags "-X main.version=<+codebase.tag> -X main.build=<+pipeline.sequenceId>" -a -tags netgo -o release/linux/arm64/buildx-acr ./cmd/drone-buildx-acr
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: Plugin
                      name: BuildAndPushDockerPlugin
                      identifier: BuildAndPushDockerPlugin
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker:18
                        settings:
                          pull_image: true
                          no_cache: true
                          base_image_registry: harness0.harness.io
                          base_image_username: <+secrets.getValue("harness0HARUsername")>
                          base_image_password: <+secrets.getValue("harness0HARPAT")>
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/buildx-acr
                          dockerfile: docker/acr/Dockerfile.linux.arm64
                          auto_tag: "true"
                          auto_tag_suffix: linux-arm64
                          daemon_off: "false"
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry
                      identifier: BuildAndPushDockerRegistry
                      spec:
                        envVariables:
                          PLUGIN_NO_CACHE: "true"
                          PLUGIN_PULL_IMAGE: "true"
                          PLUGIN_ENABLE_CACHE: "false"
                        baseImageConnectorRefs:
                          - HHI_Public_Images
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/buildx-acr
                        tags:
                          - linux-arm64
                        caching: false
                        dockerfile: docker/acr/Dockerfile.linux.arm64
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> == "branch"
            variables:
              - name: DRONE_REPO_OWNER
                type: String
                description: ""
                required: false
                value: drone-plugins
    - stage:
        name: Manifest and Release
        identifier: ManifestandRelease
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Plugin
                  name: Manifest
                  identifier: Manifest
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: plugins/manifest
                    settings:
                      username: drone
                      password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                      ignore_missing: "true"
                      spec: docker/acr/manifest.tmpl
                      auto_tag: "true"
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "branch" || <+codebase.build.type>
                      == "tag"
              - step:
                  type: Run
                  name: Prepare patched Go SDK
                  identifier: Build_GoSDK
                  spec:
                    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                    shell: Sh
                    command: mkdir -p .hhi-go-toolchain && cp -a /usr/lib/go/. .hhi-go-toolchain/
                    connectorRef: HHI_Public_Images
              - step:
                  type: Run
                  name: Build release binaries
                  identifier: Build
                  spec:
                    connectorRef: HHI_Public_Images
                    image: harness0.harness.io/oci/docker_artifacts/hhi/harnessos-alpine:1@sha256:290a37c85b4284d2c11fa0778e5da79643d912a1f5a57d6f701b77644503b7e7
                    shell: Sh
                    command: |-
                      export PATH="$PWD/.hhi-go-toolchain/bin:$PATH" GOPATH=/go GOTOOLCHAIN=local
                      GOOS=linux   GOARCH=amd64   go build -ldflags "-s -w" -a -tags netgo -o release/drone-buildx-acr-linux-amd64 ./cmd/drone-buildx-acr
                      GOOS=linux   GOARCH=arm64   go build -ldflags "-s -w" -a -tags netgo -o release/drone-buildx-acr-linux-arm64 ./cmd/drone-buildx-acr
                      GOOS=darwin  GOARCH=amd64   go build -ldflags "-s -w" -a -tags netgo -o release/drone-buildx-acr-darwin-amd64 ./cmd/drone-buildx-acr
                      GOOS=darwin  GOARCH=arm64   go build -ldflags "-s -w" -a -tags netgo -o release/drone-buildx-acr-darwin-arm64 ./cmd/drone-buildx-acr
                      GOOS=windows GOARCH=amd64   go build -ldflags "-s -w" -a -tags netgo -o release/drone-buildx-acr-windows-amd64 ./cmd/drone-buildx-acr

                      apk add --no-cache zstd

                      zstd release/drone-buildx-acr-linux-amd64
                      zstd release/drone-buildx-acr-linux-arm64
                      zstd release/drone-buildx-acr-darwin-arm64
                      zstd release/drone-buildx-acr-darwin-amd64
                      zstd release/drone-buildx-acr-windows-amd64
                    envVariables:
                      CGO_ENABLED: "0"
                      GO111MODULE: "on"
              - step:
                  type: Plugin
                  name: Release
                  identifier: Release
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: plugins/github-release
                    settings:
                      api_key: <+secrets.getValue("ci_job_github_pat")>
                      title: <+trigger.tag>
                      files: release/drone-buildx-acr-*.zst
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "tag"
              - step:
                  name: Upload_Binaries_To_GCS
                  identifier: Upload_Binaries_To_GCS
                  template:
                    templateRef: Upload_Binary_GCS_TI
                    versionLabel: v1
                    templateInputs:
                      type: GCSUpload
                      spec:
                        sourcePath: /harness/release
                        target: drone-buildx-acr/<+trigger.tag>/
                      when:
                        condition: <+codebase.build.type> == "tag"
        variables:
          - name: DRONE_REPO_OWNER
            type: String
            description: ""
            required: false
            value: drone-plugins
  allowStageExecutions: true
  identifier: dronebuildxacrharness_ebttest
  name: drone-buildx-acr-harness - ebt-test
